default_agent: ppo_historical_checkpoint

# Agent modes for credit saving
# full_llm: Use HF LLM for every turn
# hybrid: Use HF LLM on high-risk situations or every N turns
# ppo_only: Use only PPO agent
mode: hybrid

# Hybrid mode settings
hybrid_threshold: 10  # Use HF every N turns in hybrid mode

# Historical Qwen RL policy settings. HF_ADAPTER_PATH must point to the exact
# immutable Hugging Face cache snapshot described in configs/artifacts_v1.json.
hf_policy_mode: qwen_rl
hf_timeout: 10.0

# PPO Agent settings
ppo_model_path: backend/train/artifacts/best_model/best_model.zip
ppo_device: cpu  # Live deployment only; authoritative benchmark loading remains unchanged.
